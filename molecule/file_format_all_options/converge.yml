---
# yamllint disable rule:line-length
- name: 'File format all options | converge'
  hosts: 'all'
  gather_facts: false
  tasks:
    - name: 'File format all options | converge | apply r_pufky.srv.systemd'
      ansible.builtin.include_role:
        name: 'r_pufky.srv.systemd'

- name: 'File format all options | converge | override'
  hosts: 'systemd-debian-12-file_format_all_options-override'
  gather_facts: false
  tasks:
    - name: 'File format all options | coverge | override | apply r_pufky.srv.systemd'
      ansible.builtin.include_role:
        name: 'r_pufky.srv.systemd'
      vars:
        systemd_services:
          - name: 'reboot'
            state: 'present'
            override: true
            service:
              exec_start:
                - ''
                - 'echo old exec_start over-written'
        systemd_timers:
          - name: 'reboot'
            state: 'present'
            override: true
            timer:
              on_calendar:
                - ''
                - '1day'
