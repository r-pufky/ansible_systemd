          - not _test_systemd_service_override.changed
        fail_msg: '/etc/systemd/system/reboot.service.d/override.conf is not in expected format: {{ _test_systemd_service_override.diff }}.'

- name: 'File format all options | verify | timer override'
  hosts: 'systemd-debian-12-file_format_all_options-override'
  gather_facts: false
  tasks:
    - name: 'File format all options | verify | timer override | query file'
      ansible.builtin.copy:
        src: 'files/reboot.timer.override'
        dest: '/etc/systemd/system/reboot.timer.d/override.conf'
        owner: 'root'
        group: 'root'
        mode: '0644'
      check_mode: true
      diff: true
      register: _test_systemd_timer_override

    - name: 'File format all options | verify | timer override | assert expected file'
      ansible.builtin.assert:
        that:
          - not _test_systemd_timer_override.changed
        fail_msg: '/etc/systemd/system/reboot.timer.d/override.conf is not in expected format: {{ _test_systemd_timer_override.diff }}.'
