---
# yamllint disable rule:line-length
- name: 'Timer service | verify | test.service'
  hosts: 'debian-12-timer_service'
  gather_facts: false
  tasks:
    - name: 'Timer service | verify | test.service | gather service status'
      ansible.builtin.service_facts:

    - name: 'Timer service | verify | test.service | query file'
      ansible.builtin.copy:
        src: 'files/test.service'
        dest: '/etc/systemd/system/test.service'
        owner: 'root'
        group: 'root'
        mode: '0644'
      check_mode: true
      diff: true
      register: _test_systemd_timer_service

    - name: 'Timer service | verify | test.service | assert service active'
      ansible.builtin.assert:
        that:
          - '"test.service" in ansible_facts.services'
        fail_msg: 'test.service should be enabled.'

    - name: 'Timer service | verify | test.service | assert expected file'
      ansible.builtin.assert:
        that:
          - not _test_systemd_timer_service.changed
        fail_msg: '/etc/systemd/system/test.service is not in expected format: {{ _test_systemd_timer_service.diff }}.'

- name: 'Timer service | verify | test.timer'
  hosts: 'debian-12-timer_service'
  gather_facts: false
  tasks:
    - name: 'Timer service | verify | test.timer | gather timer status'
      ansible.builtin.command: 'systemctl status test.timer'
      register: _test_systemd_timer_status
      changed_when: false

    - name: 'Timer service | verify | test.timer | query file'
      ansible.builtin.copy:
        src: 'files/test.timer'
        dest: '/etc/systemd/system/test.timer'
        owner: 'root'
        group: 'root'
        mode: '0644'
      check_mode: true
      diff: true
      register: _test_systemd_timer_service

    - name: 'Timer service | verify | test.timer | assert timer active'
      ansible.builtin.assert:
        that:
          - _test_systemd_timer_status.rc == 0
          - '"Active: active" in _test_systemd_timer_status.stdout'
        fail_msg: 'test.timer should be enabled.'

    - name: 'Timer service | verify | test.timer | assert expected file'
      ansible.builtin.assert:
        that:
          - not _test_systemd_timer_service.changed
        fail_msg: '/etc/systemd/system/test.timer is not in expected format: {{ _test_systemd_timer_service.diff }}.'

- name: 'Timer service | verify | test.service remove'
  hosts: 'debian-12-timer_service-remove'
  gather_facts: false
  tasks:
    - name: 'Timer service | verify | test.service remove | gather service status'
      ansible.builtin.service_facts:

    - name: 'Timer service | verify | test.service remove | query file'
      ansible.builtin.stat:
        path: '/etc/systemd/system/test.service'
      register: _test_systemd_test_service_remove

    - name: 'Timer service | verify | test.service remove | assert service inactive'
      ansible.builtin.assert:
        that:
          - '"test.service" not in ansible_facts.services'
        fail_msg: 'test.service should not be enabled.'

    - name: 'Timer service | verify | test.service remove | assert file removed'
      ansible.builtin.assert:
        that:
          - not _test_systemd_test_service_remove.stat.exists
        fail_msg: '/etc/systemd/system/test.service should not exist.'

- name: 'Timer service removal | verify | test.timer'
  hosts: 'debian-12-timer_service-remove'
  gather_facts: false
  tasks:
    - name: 'Timer service | verify | test.timer remove | gather timer status'
      ansible.builtin.command: 'systemctl status test.timer'
      register: _test_systemd_timer_status
      changed_when: false
      failed_when: _test_systemd_timer_status.rc != 4

    - name: 'Timer service | verify | test.timer remove | query file'
      ansible.builtin.stat:
        path: '/etc/systemd/system/test.timer'
      register: _test_systemd_test_timer_remove

    - name: 'Timer service | verify | test.timer remove | assert timer inactive'
      ansible.builtin.assert:
        that:
          - _test_systemd_timer_status.rc == 4
        fail_msg: 'test.timer should not be enabled.'

    - name: 'Timer service | verify | test.timer remove | assert file removed'
      ansible.builtin.assert:
        that:
          - not _test_systemd_test_timer_remove.stat.exists
        fail_msg: '/etc/systemd/system/test.timer should not exist.'
