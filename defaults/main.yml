---
###############################################################################
# Systemd Unit Configuration and Management
###############################################################################
# Manage systemd units. Standard ansible built-ins may be used after
# configuration (stop, start, reload, etc). Systemd will be force reloaded on
# role completion to ensure unit availability after role application.
#
# Variables are defined in sections directory using lower_with_under; and are
# omitted by default unless specified. Use grep to find explicit definitions
# and sections for reference:
#
#   grep -ri 'variable: exec_start'
#   > service.yml:173:# Variable: exec_start | list of str
#
# All supported systemd options have been documented in sections.
#
# Actively migrate cronjobs to systemd (use timers, see reference).
#
# Units are managed in the following order:
#      load: Mount, automount, service, timer.
#    enable: Mount, automount, service, timer.
#   disable: Service, timer, automount, mount.
#    unload: Service, timer, automount, mount.
#
# Reference:
# * section/*.yml
# * https://unix.stackexchange.com/questions/278564/cron-vs-systemd-timers
# * https://gist.github.com/hkoba/e05c91ebdd4e2ffd1d79e78e76cf1ff5
# * https://wiki.archlinux.org/title/Systemd/Timers#As_a_cron_replacement
# * https://opensource.com/article/20/7/systemd-timers

# Service definitions.
#
# Managed files are placed in systemd_role_root with root:root 0644.
#
# systemd_services:
#     list of dict - Services to manage for systemd.
#   - name: str - Service name.
#         Special Case:
#           [a-z,A-Z,:,-,_,.,\]: Acceptable characters, max length 255.
#         Values:
#            {NAME}: Service name (name.service).
#           {NAME}@: Template service name (name@.service); may be referenced
#                    using SPECIFIERS (%i, etc) in definitions.
#     state: str - Service install state.
#         Values:
#           present: Manage configuration.
#            absent: Remove configuration.
#         Default: 'present'.
#     drop_in: bool - Manage service using systemd drop-in at
#           systemd/{SERVICE}.d/override.conf instead of service unit itself
#           (systemd/{SERVICE}).
#         Special Case:
#           *: Add an empty value before settings to clear previous definition
#              exec_start: ['', 'new_exec_options'].
#     unit: dict - section/unit/*.yml unit definition.
#     service: dict - section/service.yml unit definition.
#     exec: dict - section/exec/*.yml unit definition.
#     resource_control: dict - section/resource_control/*.yml unit definition.
#     kill: dict - section/kill.yml unit definition.
#     install: dict - section/install.yml install definition.
#
# systemd_services:
#   - name: 'reboot'
#     state: 'present'
#     drop_in: false
#     unit:
#       description: 'periodic system reboot service'
#       requires:
#         - 'reboot.timer'
#     service:
#       type: 'simple'
#       exec_start: ['perl -e "sleep(rand(30))";/sbin/reboot']
#       user: 'root'
#   - name: 'nfs-server'
#     state: 'present'
#     drop_in: true
#     service:
#       exec_start:
#         - ''
#         - '/usr/sbin/rpc.nfsd --no-nfs-version 3'
#
# Default: [].
systemd_services: []

# Timer definitions.
#
# Managed files are placed in systemd_role_root with root:root 0644.
#
# systemd_timers:
#     list of dict - Timers to manage for systemd.
#   - name: str - Timer name.
#         Special Case:
#           [a-z,A-Z,:,-,_,.,\]: Acceptable characters, max length 255.
#         Values:
#            {NAME}: Timer name (name.timer).
#           {NAME}@: Template timer name (name@.timer); may be referenced using
#                    SPECIFIERS (%i, etc) in definitions.
#     state: str - Timer install state.
#         Values:
#           present: Manage configuration.
#            absent: Remove configuration.
#         Default: 'present'.
#     drop_in: bool - Manage timer using systemd drop-in at
#           systemd/{TIMER}.d/override.conf instead of service unit itself
#           (systemd/{TIMER}).
#         Special Case:
#           *: Add an empty value before settings to clear previous definition
#              on_calendar: ['', 'weekly'].
#     unit: dict - section/unit/*.yml unit definition.
#     timer: dict - section/timer.yml timer definition.
#     install: dict - section/install.yml install definition.
#
# systemd_timers:
#   - name: 'reboot'
#     state: 'present'
#     drop_in: false
#     unit:
#       description: 'periodic system reboot timer'
#     timer:
#       unit: 'reboot.service'
#       on_boot_sec: '1month'
#     install:
#       wanted_by:
#         - 'timers.target'
#
# Default: [].
systemd_timers: []

# Mount definitions.
#
# Managed files are placed in systemd_role_root with root:root 0644.
#
# systemd_mounts:
#     list of dict - Mounts to manage for systemd.
#   - name: str - Mount name.
#         Special Case:
#           [a-z,A-Z,:,-,_,.,\]: Acceptable characters, max length 255.
#                             *: MUST BE NAMED AFTER mount.where; all mount
#                                names must reflect the mount point translated
#                                to acceptable systemd mount names (e.g.
#                                /mnt/dir -> mnt-dir). Use
#                                systemd-escape -p /mount/path to generate an
#                                appropriate name.
#         Values:
#            {NAME}: Mount name (name.mount).
#     state: str - Timer install state.
#         Values:
#           present: Manage configuration.
#            absent: Remove configuration.
#         Default: 'present'.
#     drop_in: bool - Manage mount using systemd drop-in at
#           systemd/{MOUNT}.d/override.conf instead of service unit itself
#           (systemd/{MOUNT}).
#         Special Case:
#           *: Add an empty value before settings to clear previous definition
#              options: ['', 'noauto'].
#     unit: dict - section/unit/*.yml unit definition.
#     mount: dict - section/mount.yml unit definition.
#     exec: dict - section/exec/*.yml unit definition.
#     resource_control: dict - section/resource_control/*.yml unit definition.
#     kill: dict - section/kill.yml unit definition.
#     install: dict - section/install.yml install definition.
#
# systemd_mounts:
#   - name: 'data-pictures'
#     state: 'present'
#     drop_in: false
#     unit:
#       description: 'mount /data/pictures'
#     mount:
#       what: '172.16.24.192:/home'
#       where: '/data/pictures'
#       options:
#         - 'vers=4'
#         - 'minorversion=2'
#       type: 'nfs'
#       timeout_sec: 30
#     install:
#       wanted_by:
#         - 'multi-user.target'
#   - name: 'mnt-test'
#     state: 'present'
#     drop_in: false
#     unit:
#       description: 'test mount tmpfs'
#     mount:
#       what: 'tmpfs'
#       where: '/mnt/test'
#       type: 'tmpfs'
#       options:
#         - 'noatime'
#         - 'nosuid'
#         - 'nodev'
#         - 'noexec'
#         - 'mode=1777'
#     install:
#       wanted_by:
#         - 'multi-user.target'
#   - name: 'tmp'
#     state: 'present'
#     drop_in: true
#     unit:
#       description: 'override default tmpfs mode'
#     mount:
#       options:
#         - 'mode=1222'
#
# Default: [].
systemd_mounts: []

# Automount definitions.
#
# Managed files are placed in systemd_role_root with root:root 0644. Automount
# will automatically stop the associate mount so it can be enabled.
#
# systemd_automounts:
#     list of dict - Automounts to manage for systemd.
#   - name: str - Mount name.
#         Special Case:
#           [a-z,A-Z,:,-,_,.,\]: Acceptable characters, max length 255.
#                             *: MUST BE NAMED AFTER mount.where; all mount
#                                names must reflect the mount point translated
#                                to acceptable systemd mount names (e.g.
#                                /mnt/dir -> mnt-dir). Use
#                                systemd-escape -p /mount/path to generate an
#                                appropriate name.
#         Values:
#            {NAME}: Mount name (name.mount).
#     state: str - Timer install state.
#         Values:
#           present: Manage configuration.
#            absent: Remove configuration.
#         Default: 'present'.
#     drop_in: bool - Manage mount using systemd drop-in at
#           systemd/{MOUNT}.d/override.conf instead of service unit itself
#           (systemd/{MOUNT}).
#         Special Case:
#           *: add an empty value before settings to clear previous definition
#              options: ['', 'noauto'].
#     unit: dict - section/unit/*.yml unit definition
#     automount: dict - section/automount.yml unit definition
#     exec: dict - section/exec/*.yml unit definition
#     resource_control: dict - section/resource_control/*.yml unit definition
#     kill: dict - section/kill.yml unit definition
#     install: dict - section/install.yml install definition
#
# systemd_automounts:
#   - name: 'mnt-test'
#     state: 'present'
#     drop_in: false
#     unit:
#       description: 'automount configuration test'
#     automount:
#       where: '/mnt/test'
#     install:
#       wanted_by:
#         - 'multi-user.target'
#   - name: 'mnt-test'
#     state: 'present'
#     drop_in: true
#     unit:
#       description: 'override automount configuration test'
#
# Default: [].
systemd_automounts: []

# Enable systemctl daemon-reload when applying role?
#
# In certain situations, systemd daemon cannot be reloaded (if drop-in is
# required before the service exists as with certain package installations or
# for systems where it is not supported, such as containers).
#
# Edge cases:
# * Idempotent tasks might report no change if run in a previous execution but
#   before daemon-reload had a chance to execute. This also occurs when the is
#   replaced with the same content.
#
# Unless explicitly needed, this should always be enabled.
#
# Please file a detailed bug if specific edge cases are encountered -- forcing
# flush handlers in your role after this role completes -- is a sign that
# you've triggered one of these nuanced ansible edge cases.
#
# Default: True.
systemd_daemon_reload_enable: true
