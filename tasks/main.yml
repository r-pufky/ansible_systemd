- name: 'Unload service'
  ansible.builtin.include_tasks: 'unload/service.yml'
  loop: '{{ systemd_services | default([]) }}'
  loop_control:
    loop_var: 'systemd'
    label: '{{ systemd.name }}'

- name: 'Unload timer'
  ansible.builtin.include_tasks: 'unload/timer.yml'
