---
# Always load everything before removing to prevent dependency failures.
#
# TODO(role): Add remaining units as implementation requires: socket device
#     swap target path slice scope.
- name: 'Load mount'
  ansible.builtin.include_tasks: 'load/mount.yml'
  loop: '{{ systemd_mounts | default([]) }}'
  loop_control:
    loop_var: 'systemd'
    label: '{{ systemd.name }}'

- name: 'Load automount'
  ansible.builtin.include_tasks: 'load/automount.yml'
  loop: '{{ systemd_automounts | default([]) }}'
  loop_control:
    loop_var: 'systemd'
    label: '{{ systemd.name }}'

- name: 'Load service'
  ansible.builtin.include_tasks: 'load/service.yml'
  loop: '{{ systemd_services | default([]) }}'
  loop_control:
    loop_var: 'systemd'
    label: '{{ systemd.name }}'

- name: 'Load timer'
  ansible.builtin.include_tasks: 'load/timer.yml'
  loop: '{{ systemd_timers | default([]) }}'
  loop_control:
    loop_var: 'systemd'
    label: '{{ systemd.name }}'

- name: 'Enable mount'
