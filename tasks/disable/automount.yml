---
###############################################################################
# Disable a defined systemd automount
###############################################################################
#
# Args:
#   systemd: dict containing one element from systemd_mounts.

- name: 'Systemd | disable | automount {{ systemd.name }}'
  when: >
    systemd.state | lower == 'absent' and
    not (systemd_testing_enable | default(false))
  notify: 'Handlers | reload systemd'
  ansible.builtin.service:
    name: '{{ systemd.name }}.automount'
    enabled: false
    state: 'stopped'
